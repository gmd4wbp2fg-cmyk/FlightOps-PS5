olid var(--line);border-radius:15px;padding:18px}.training-modal-details{grid-template-columns:repeat(4,minmax(0,1fr))}.training-modal-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.training-modal-actions .action{min-height:44px}@media(max-width:720px){.training-modal-backdrop{padding:12px;align-items:flex-start}.training-modal{margin-top:8px;padding:17px;max-height:94vh}.training-modal-details{grid-template-columns:repeat(2,minmax(0,1fr))}.training-program-option{align-items:flex-start}.training-modal-actions .action{flex:1 1 100%}}.details{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:18px 0;align-items:stretch}.detail{background:#0a1727;border:1px solid var(--line);padding:12px;border-radius:11px;min-width:0;box-sizing:border-box;overflow:hidden}.detail strong{overflow-wrap:anywhere;word-break:break-word;line-height:1.25}.detail input,.detail textarea{display:block;width:100%;max-width:100%;height:40px;margin-top:8px;box-sizing:border-box;border:1px solid var(--line);background:#091522;color:var(--text);border-radius:10px;padding:10px 11px;min-height:40px}.detail input{font:inherit;line-height:18px}.detail strong{display:block;margin-top:4px}.callout,.notice{margin:16px 0;padding:13px 15px;background:#181a22;border-left:3px solid var(--gold);line-height:1.5}.notice{border:1px solid #285e4e;background:#0c251f;border-radius:13px;color:#cde8df}.bar{height:9px;background:#091522;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:0}.fleet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.plane{box-shadow:none;min-width:0;overflow:hidden}.plane h3{overflow-wrap:anywhere;word-break:break-word;line-height:1.2}.plane .details{grid-template-columns:repeat(2,minmax(0,1fr));min-width:0}.plane .detail{min-width:0}.plane .detail .label{white-space:normal;overflow-wrap:anywhere;word-break:break-word}.plane .small{overflow-wrap:anywhere;word-break:break-word}.owned{color:var(--green);font-size:11px;font-weight:900}.locked{opacity:.62}.price{color:var(--gold);font-size:20px;font-weight:900;margin:12px 0}.form{display:grid;gap:12px;max-width:480px}.form input,.form textarea{width:100%;border:1px solid var(--line);background:#091522;color:var(--text);border-radius:10px;padding:12px}.form textarea{min-height:90px}.label textarea{display:block;width:100%;min-height:150px;margin-top:8px;box-sizing:border-box;resize:vertical;font:inherit;line-height:1.45}.label select{display:block;width:100%;margin-top:8px;box-sizing:border-box}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:#10263e;border:1px solid #3b6c95;padding:13px 18px;border-radius:12px;transition:.25s;z-index:10}.toast.show{transform:translateX(-50%) translateY(0)}.choice{color:var(--text);background:linear-gradient(145deg,#101f33,#0c192a);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--text)}.choice b{color:var(--text)}.choice.selected{border-color:var(--blue);outline:1px solid var(--blue);color:var(--text)}@media(max-width:760px){.app{padding:10px 12px 90px}.hero,.mission{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}.s4,.s5,.s6,.s7,.s8,.s12{grid-column:span 1}.details{grid-template-columns:repeat(2,1fr)}.fleet{grid-template-columns:1fr}.hero h1{font-size:29px}}

/* Mission Presentation Upgrade */
.mission{
  position:relative;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:stretch;
  margin:12px 0;
  padding:18px 18px 18px 21px;
  background:linear-gradient(135deg,#12263d,#0b1828 72%);
  border:1px solid #2b4d6d;
  border-radius:16px;
  box-shadow:0 10px 28px #0004;
  overflow:hidden;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.mission:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  background:linear-gradient(180deg,var(--blue),var(--green));
}
.mission:hover{
  transform:translateY(-2px);
  border-color:#4b82ae;
  box-shadow:0 15px 34px #0006;
}
.mission>div:first-child{min-width:0;flex:1}
.mission h3{font-size:20px;margin:7px 0 8px;color:#fff}
.mission .route{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:15px;
  font-weight:900;
  color:#e5f2ff;
  background:#081727;
  border:1px solid #254663;
  border-radius:9px;
  padding:8px 10px;
  margin:2px 0 8px;
}
.mission .route:before{content:"✈";color:var(--blue)}
.mission .small{margin-top:4px}
.mission .tag{box-shadow:inset 0 1px #ffffff10}
.mission .tag:first-child{background:#173b5d;color:#d9edff}
.mission .reward{
  display:inline-block;
  margin-top:9px;
  padding:7px 10px;
  border-radius:9px;
  background:#102d25;
  border:1px solid #285a4c;
  color:#6ff0bf;
  font-size:15px;
}
.mission .action.primary{
  align-self:center;
  min-width:118px;
  min-height:46px;
  box-shadow:0 7px 18px #0004;
}
.mission:has(.tag:nth-child(2)){
  background:linear-gradient(135deg,#132b43,#0b1828 72%);
}
.ops-card:has(.mission){
  background:linear-gradient(180deg,#0f1e31,#0b1727);
}
@media(max-width:760px){
  .mission{gap:12px;padding:16px 15px 16px 18px}
  .mission .action.primary{width:100%;min-width:0}
  .mission h3{font-size:18px}
}
/* Mission Brief Presentation Upgrade */
.brief-hero{
  display:flex;justify-content:space-between;gap:22px;align-items:flex-end;
  margin:10px 0 14px;padding:22px 24px;
  background:linear-gradient(135deg,#132c45,#0a1727 72%);
  border:1px solid #315b7e;border-radius:20px;
  box-shadow:0 18px 50px #0005;position:relative;overflow:hidden
}
.brief-hero:after{content:"";position:absolute;right:-80px;top:-100px;width:240px;height:240px;border-radius:50%;background:#46a8ff10;box-shadow:0 0 90px #46a8ff12}
.brief-hero-main{position:relative;z-index:1;min-width:0}
.brief-hero h1{font-size:36px;line-height:1.05;margin:9px 0 8px}
.brief-hero p{color:#c5d7e9;margin:0;font-size:15px}
.brief-status-row{display:flex;gap:7px;flex-wrap:wrap}
.brief-value{position:relative;z-index:1;min-width:150px;text-align:right}
.brief-value .money{font-size:31px}
.brief-route-banner{
  display:flex;justify-content:space-between;align-items:center;gap:18px;
  margin:0 0 14px;padding:17px 20px;
  background:#091827;border:1px solid #2a4d6b;border-radius:15px;
  box-shadow:inset 0 1px #ffffff08
}
.brief-route-banner strong{display:block;font-size:22px;letter-spacing:.4px;margin-top:5px}
.brief-route-stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.brief-route-stats span{
  padding:8px 10px;border-radius:9px;background:#10263b;
  border:1px solid #294b68;color:#d5e7f7;font-size:12px;font-weight:800
}
.brief-hero+.brief-route-banner{}
.brief-route-banner+.grid .ops-card:first-child{border-color:#315b7e}
@media(max-width:760px){
  .brief-hero{flex-direction:column;align-items:flex-start;padding:18px}
  .brief-hero h1{font-size:29px}
  .brief-value{text-align:left;min-width:0}
  .brief-route-banner{flex-direction:column;align-items:flex-start}
  .brief-route-stats{justify-content:flex-start}
}

/* Dispatch Brief Presentation Upgrade */
.brief-hero{
  position:relative;display:flex;justify-content:space-between;gap:24px;align-items:stretch;
  margin:10px 0 20px;padding:24px;border:1px solid #315a7d;border-radius:22px;
  background:radial-gradient(circle at 82% 28%,#1c4968 0,#112b45 32%,#0b1727 72%);
  box-shadow:0 18px 55px #0006;overflow:hidden;
}
.brief-hero:after{content:"✈";position:absolute;right:34px;bottom:-24px;font-size:120px;color:#ffffff08;transform:rotate(-8deg)}
.brief-hero-main{position:relative;z-index:1;min-width:0}
.brief-hero-main h1{font-size:38px;margin:14px 0 7px;letter-spacing:-.5px}
.brief-hero-main p{color:#b9cee3;margin:0;font-size:15px}
.brief-status-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.brief-value{position:relative;z-index:1;min-width:170px;align-self:center;text-align:right;padding-left:18px;border-left:1px solid #ffffff18}
.brief-value .money{font-size:32px;margin:4px 0}
.brief-route-banner{
  display:flex;justify-content:space-between;gap:18px;align-items:center;
  margin:0 0 14px;padding:15px 18px;background:#091827;border:1px solid #284762;border-radius:15px;
}
.brief-route-banner strong{display:block;font-size:20px;letter-spacing:.4px}
.brief-route-stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.brief-route-stats span{padding:7px 10px;border-radius:9px;background:#10263d;border:1px solid #294a67;color:#c8dced;font-size:12px;font-weight:800}
.brief-hero + .grid .ops-card{box-shadow:0 12px 36px #0004}
.brief-hero + .grid .callout{background:linear-gradient(135deg,#171e27,#101820);border-left-color:var(--blue)}
@media(max-width:760px){
  .brief-hero{padding:19px;display:block}
  .brief-hero-main h1{font-size:29px}
  .brief-value{text-align:left;border-left:0;border-top:1px solid #ffffff18;padding:14px 0 0;margin-top:18px}
  .brief-value .money{font-size:28px}
  .brief-route-banner{display:block}
  .brief-route-stats{justify-content:flex-start;margin-top:10px}
}

/* Dispatch Command Strip */
.brief-command-strip{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin:0 0 16px;
  padding:12px;
  background:linear-gradient(135deg,#0b1b2c,#081522);
  border:1px solid #294a67;
  border-radius:16px;
  box-shadow:inset 0 1px #ffffff08,0 10px 28px #0003;
}
.brief-command-strip>div{
  min-width:0;
  padding:10px 12px;
  background:#0d2034;
  border:1px solid #213f5b;
  border-radius:11px;
}
.brief-command-strip strong{
  display:block;
  margin-top:4px;
  color:#eef7ff;
  font-size:13px;
  line-height:1.2;
  overflow-wrap:anywhere;
}
.brief-command-strip .small{display:block;margin-top:4px;font-size:11px}
.brief-command-strip>div:first-child{border-color:#285e4e;background:#0d241f}
.brief-command-strip>div:first-child strong{color:#6ff0bf}
@media(max-width:760px){
  .brief-command-strip{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:9px}
  .brief-command-strip>div{padding:9px}
}
@media(max-width:430px){
  .brief-command-strip{grid-template-columns:1fr}
}

/* Accepted Dispatch Release */
.dispatch-accepted-card{
  background:linear-gradient(135deg,#102d25,#0b1c24 62%,#0b1727);
  border:1px solid #2d715d;
  box-shadow:0 16px 44px #0005;
}
.dispatch-accepted-head{
  display:flex;justify-content:space-between;gap:18px;align-items:flex-start;
}
.dispatch-accepted-head h2{margin:5px 0 7px;font-size:27px}
.dispatch-accepted-badge{
  display:inline-flex;align-items:center;gap:8px;padding:9px 12px;
  border-radius:999px;background:#0a241d;border:1px solid #2d715d;
  color:#6ff0bf;font-size:11px;font-weight:900;white-space:nowrap;
}
.dispatch-accepted-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:16px;
}
.dispatch-accepted-grid>div{
  background:#091b1d;border:1px solid #244c45;border-radius:11px;padding:11px 12px;
}
.dispatch-accepted-grid strong{
  display:block;margin-top:4px;line-height:1.25;overflow-wrap:anywhere;
}
@media(max-width:760px){
  .dispatch-accepted-head{display:block}
  .dispatch-accepted-badge{margin-top:12px}
  .dispatch-accepted-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:430px){
  .dispatch-accepted-grid{grid-template-columns:1fr}
}

/* Active Dispatch Command Strip */
.active-command-strip{
  display:grid;grid-template-columns:1.6fr .8fr .8fr;gap:10px;
  margin:0 0 14px;padding:11px;
  background:linear-gradient(135deg,#0c1f31,#081522);
  border:1px solid #31516d;border-radius:16px;
  box-shadow:inset 0 1px #ffffff08,0 10px 30px #0004;
}
.active-command-strip>div{
  min-width:0;background:#0d2034;border:1px solid #213f5b;
  border-radius:11px;padding:11px 12px;
}
.active-command-strip .active-command-main{
  display:flex;align-items:center;gap:10px;
  background:#0d241f;border-color:#2d715d;
}
.active-command-main .ops-dot{flex:none;width:9px;height:9px}
.active-command-main strong,.active-command-strip>div:not(.active-command-main) strong{
  display:block;margin-top:4px;color:#eef7ff;font-size:13px;line-height:1.2;
  overflow-wrap:anywhere;
}
.active-command-main strong{color:#6ff0bf}
.active-command-strip .small{display:block;margin-top:4px;font-size:11px}
@media(max-width:760px){
  .active-command-strip{grid-template-columns:1fr 1fr}
  .active-command-strip .active-command-main{grid-column:1 / -1}
}
@media(max-width:430px){
  .active-command-strip{grid-template-columns:1fr}
  .active-command-strip .active-command-main{grid-column:auto}
}

/* Pilot Record / Official Logbook */
.pilot-record-hero{
  align-items:stretch;padding:22px 24px;border:1px solid #315b7e;border-radius:21px;
  background:radial-gradient(circle at 78% 24%,#1b4968 0,#112b45 32%,#0b1727 72%);
  box-shadow:0 18px 52px #0006;
}
.pilot-record-title{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pilot-record-title h1{margin-bottom:5px}
.pilot-command-strip{
  display:grid;grid-template-columns:2fr repeat(3,minmax(0,1fr));gap:10px;margin:0 0 15px;
  padding:11px;background:#091827;border:1px solid #294a67;border-radius:16px;
}
.pilot-command-strip>div{
  min-width:0;padding:11px 12px;background:#0d2034;border:1px solid #213f5b;border-radius:11px;
}
.pilot-command-strip strong{display:block;margin-top:4px;color:#eef7ff;overflow-wrap:anywhere}
.pilot-command-main{display:flex;align-items:center;gap:9px}
.pilot-command-main strong{color:#6ff0bf}
.pilot-stat-card{min-height:108px}
.pilot-stat-value{font-size:25px;font-weight:900;color:#eef7ff;margin-top:5px}
.pilot-standing-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pilot-standing-grid>div{padding:11px;background:#0a1727;border:1px solid var(--line);border-radius:11px}
.pilot-standing-grid strong{display:block;margin-top:4px;color:#eef7ff;overflow-wrap:anywhere}
.pilot-qualifications{display:flex;flex-wrap:wrap;gap:8px}
.pilot-qualifications span{padding:8px 10px;border-radius:999px;background:#0b2135;border:1px solid #28516f;color:#cfe8fb;font-size:12px;font-weight:800}
.pilot-performance-list{display:grid;gap:8px}
.pilot-performance-list>div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.pilot-performance-list>div:last-child{border-bottom:0}
.pilot-performance-list span{color:var(--muted)}
.pilot-history-list{display:grid}
