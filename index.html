<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>FlightOps PS5</title><style>
:root{--bg:#07111f;--panel:#0f1d30;--line:#28415e;--text:#f0f6ff;--muted:#91a5bd;--blue:#46a8ff;--green:#39d6a0;--gold:#f4ca5c;--red:#ff7272}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}.app{max-width:1180px;margin:auto;padding:16px 16px 100px}header{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 17px;border-bottom:1px solid var(--line)}.logo{font-weight:900;letter-spacing:.6px}.logo b,.eyebrow{color:var(--blue)}.mode,.tag{font-size:11px;color:#bdd0e4;background:#10243b;border:1px solid #294763;padding:7px 10px;border-radius:99px}.tag{display:inline-block;border:0;border-radius:7px;padding:5px 7px;margin:0 5px 7px 0;font-weight:800}nav{display:flex;gap:7px;padding:15px 0;overflow:auto;position:sticky;top:0;background:linear-gradient(var(--bg) 75%,transparent);z-index:4}button{font:inherit;cursor:pointer}nav button,.action{background:transparent;color:var(--muted);border:1px solid transparent;padding:10px 15px;border-radius:10px;white-space:nowrap}nav button.active,nav button:hover,.action{background:#172b43;color:var(--text);border-color:#2a4e70}.primary{background:var(--blue);border-color:var(--blue);color:#03101d;font-weight:800}button:disabled{opacity:.45;cursor:not-allowed}.view{display:none}.view.active{display:block}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin:10px 0 22px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;font-weight:900;background:none;padding:0;border:0}.hero h1{font-size:34px;margin:6px 0}.hero p,.small,.copy{color:var(--muted);line-height:1.5}.money{color:var(--green);font-size:27px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card,.plane{background:linear-gradient(145deg,#101f33,#0c192a);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 14px 40px #0003}.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.stat{font-size:25px;font-weight:900;margin-top:5px}h2{margin:5px 0 14px}h3{margin:0 0 7px}.mission,.historyrow{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:14px 0}.mission+.mission,.historyrow{border-top:1px solid var(--line)}.route{font-size:13px;color:#c9d7e7}.reward{color:var(--gold);font-weight:900;white-space:nowrap}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}.detail{background:#0a1727;border:1px solid var(--line);padding:12px;border-radius:11px}.detail strong{display:block;margin-top:4px}.callout,.notice{margin:16px 0;padding:13px 15px;background:#181a22;border-left:3px solid var(--gold);line-height:1.5}.notice{border:1px solid #285e4e;background:#0c251f;border-radius:13px;color:#cde8df}.bar{height:9px;background:#091522;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:0}.fleet{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.plane{box-shadow:none}.owned{color:var(--green);font-size:11px;font-weight:900}.locked{opacity:.62}.price{color:var(--gold);font-size:20px;font-weight:900;margin:12px 0}.form{display:grid;gap:12px;max-width:480px}.form input,.form textarea{width:100%;border:1px solid var(--line);background:#091522;color:var(--text);border-radius:10px;padding:12px}.form textarea{min-height:90px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:#10263e;border:1px solid #3b6c95;padding:13px 18px;border-radius:12px;transition:.25s;z-index:10}.toast.show{transform:translateX(-50%) translateY(0)}.choice.selected{border-color:var(--blue);outline:1px solid var(--blue)}@media(max-width:760px){.app{padding:10px 12px 90px}.hero,.mission{flex-direction:column;align-items: </style></head><body><div class="app"><header><div class="logo">FLIGHT<b>OPS</b> PS5</div><div class="mode">MSFS 2024 • FREE FLIGHT</div></header><nav id="nav"></nav><main id="app"></main></div><div id="toast" class="toast"></div><script type="module" src="/src/main.js"></script></body></html>
